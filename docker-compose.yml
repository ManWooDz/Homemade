services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: homemade
      POSTGRES_USER: homemade
      POSTGRES_PASSWORD: homemade_dev_only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homemade -d homemade"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
