<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeMade reset QA</title></head><body><div id="root"></div><script type="module">
const originalFetch = window.fetch.bind(window);
const flags = new URLSearchParams(location.search);
let verifies = 0, resets = 0;
document.documentElement.dataset.qaFixture = "reset-password";
const json = (data, status = 200) => new Response(JSON.stringify(data), { status, headers: { "Content-Type": "application/json" } });
window.fetch = async (input, options = {}) => {
    const path = new URL(typeof input === "string" ? input : input.url, location.origin).pathname;
    if (!path.startsWith("/api/")) return originalFetch(input, options);
    document.documentElement.dataset.qaRequests = (document.documentElement.dataset.qaRequests || "") + `${options.method || "GET"} ${path};`;
    if (path === "/api/auth/me" || path === "/api/auth/refresh") return json({}, 401);
    if (path === "/api/auth/forgot-password") return json({ status: "success" });
    if (path === "/api/auth/verify-otp") {
        verifies++;
        await new Promise(resolve => setTimeout(resolve, 600));
        return flags.has("verifyfail") && verifies === 1 ? json({}, 400) : json({ status: "success", data: { reset_ticket: "qa-only-ticket" } });
    }
    if (path === "/api/auth/reset-password") {
        resets++;
        await new Promise(resolve => setTimeout(resolve, 600));
        return flags.has("resetfail") && resets === 1 ? json({}, 400) : json({ status: "success" });
    }
    return json({ message: "Blocked by reset QA fixture" }, 404);
};
history.replaceState({}, "", "/reset-password");
await import("/src/main.jsx");
</script></body></html>
