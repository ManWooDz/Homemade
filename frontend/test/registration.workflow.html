import Onboarding from '../src/pages/auth/Onboarding.jsx';
import '../src/index.css';

const requests = [];
const token = 'synthetic-registration-recording-only';
let registeredEmail = null;

const ok = (data, status = 200) => Response.json({status:'success',data}, {status});
window.fetch = async (input, options = {}) => {
    const path = new URL(typeof input === 'string' ? input : input.url, location.origin).pathname;
    const method = options.method || 'GET';
    requests.push({path,method});
    if (path === '/api/auth/me') return verified
        ? ok({id:999,email:registeredEmail,locale:'th',has_avatar:false}) : Response.json({}, {status:401});
    if (path === '/api/auth/refresh') return Response.json({}, {status:401});
    if (path === '/api/auth/register' && method === 'POST') {
        const body = JSON.parse(options.body);
        if (!body.email.endsWith('@example.test') || body.password.length < 8)
            return Response.json({detail:'Invalid demo signup'}, {status:400});
        registeredEmail = body.email.trim().toLowerCase();
        return ok({email:registeredEmail,registration_token:token}, 202);
    }
    if (path === '/api/auth/verify-registration' && method === 'POST') {
        const body = JSON.parse(options.body);
        if (!registeredEmail || body.registration_token !== token || body.code !== '123456')
            return Response.json({detail:'Invalid or expired registration code'}, {status:400});
        verified = true;
        return ok({id:999,email:registeredEmail,locale:'th',has_avatar:false});
    }
