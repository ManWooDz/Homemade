<!doctype html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Homemade registration — 2× recording</title>
<style>
html{margin:0;width:860px;height:932px;overflow:clip}
body{position:fixed;inset:0;margin:0;width:860px;height:932px;overflow:clip;background:white;outline:none}
/* Keep the responsive viewport at430×932 and render text at2×before capture. */
iframe{position:absolute;left:0;top:0;display:block;border:0;width:430px;height:932px;transform:scale(2);transform-origin:top left}
.capture-control{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0}
</style></head><body><button class="capture-control" aria-label="Capture top" onclick="document.querySelector('iframe').style.top='0px'"></button><button class="capture-control" aria-label="Capture bottom" onclick="document.querySelector('iframe').style.top='-932px'"></button><iframe src="./registration.workflow.html" title="Registration demo"></iframe></body></html>
