<!doctype html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Homemade — Custom Cooking workflow demo</title></head>
<body><div id="root"></div><script type="module">
// Recording fixture: synthetic data, no backend or AI requests.
import React from 'react';
import { createRoot } from 'react-dom/client';
import { AuthProvider } from '../src/context/AuthContext.jsx';
import { LocaleProvider } from '../src/context/LocaleContext.jsx';
import CustomCookingPage from '../src/pages/CustomCookingPage.jsx';
import CookingPage from '../src/pages/CookingPage.jsx';
import '../src/index.css';

const requests = [];
window.fetch = async (input, options = {}) => {
    requests.push({ path: String(input), method: options.method || 'GET' });
    if (input === '/api/auth/me') return Response.json({status:'success',data:{id:999,display_name:'เชฟโฮมเมด',locale:'th',has_avatar:false}});
    if (input === '/api/user-preferences' && !options.method) return Response.json({status:'success',data:null});
    throw new Error('Unexpected request blocked by workflow demo');
};
const ingredients = [{id:1,name:'อกไก่'},{id:2,name:'ไข่ไก่'},{id:3,name:'ใบกะเพรา'},{id:4,name:'แครอท'}];
function Preview() {
    const [receipt,setReceipt] = React.useState(null);
    const onGenerate = async (preferences,selected) => {
        console.assert(selected.length > 0, 'Choose ingredients before generating');
        setReceipt({preferences,selected,requests});
        window.scrollTo(0,0);
        return null;
    };
    return React.createElement(React.Fragment,null,
        receipt
            ? React.createElement(CookingPage,{isGenerating:true,activeTab:'cooking',setActiveTab:()=>{}})
            : React.createElement(CustomCookingPage,{userIngredients:ingredients,activeTab:'cooking',setActiveTab:()=>{},onBack:()=>{},onGenerate}),
        React.createElement('output',{id:'workflow-receipt',className:'sr-only'},JSON.stringify(receipt)),
    );
}
createRoot(document.getElementById('root')).render(React.createElement(AuthProvider,null,React.createElement(LocaleProvider,null,React.createElement(Preview))));
</script></body></html>
